workflows:
  ios-unsigned-workflow:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: 20
      xcode: latest
      vars:
        XCODE_PROJECT: ios/ryP0Admin.xcodeproj
        XCODE_SCHEME: ryP0Admin
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Expo prebuild
        script: |
          set -e
          npx expo prebuild --platform ios --clean
          echo "=== 检查生成的 iOS 工程 ==="
          ls -la ios/ | head -20
          if [ ! -d "ios/ryP0Admin.xcodeproj" ]; then
            echo "ERROR: ios/ryP0Admin.xcodeproj 不存在，实际内容："
            find ios -maxdepth 2 -name "*.xcworkspace" -o -maxdepth 2 -name "*.xcodeproj" | head -10
            exit 1
          fi
          echo "✓ xcodeproj 已生成"
      - name: Build unsigned IPA
        script: |
          set -e
          mkdir -p build
          echo "=== 可用 scheme ==="
          xcodebuild -project "$XCODE_PROJECT" -list
          echo "=== 开始归档 ==="
          xcodebuild archive -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Release -destination 'generic/platform=iOS' -archivePath "$CM_BUILD_DIR/build/ryP0.xcarchive" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          APP_PATH=$(find "$CM_BUILD_DIR/build/ryP0.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p "$CM_BUILD_DIR/build/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/build/Payload/"
          cd "$CM_BUILD_DIR/build" && zip -qry ryP0-zh-unsigned.ipa Payload
    artifacts:
      - build/ryP0-zh-unsigned.ipa
